name: GKI Kernel Build for gs101

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      make_release:
        required: true
        type: boolean
        default: true
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
        default: "Next"
      kernelsu_branch:
        required: true
        type: string
        default: "Dev"
      kernelsu_branch_other:
        required: false
        type: string
      kernelsu_commit_hash:
        required: false
        type: string
      susfs_version:
        required: true
        type: string
        default: "v1.5.9"

jobs:
  build-kernel-gs101-kernelsu-susfs:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      REPO_OWNER: RiRiRawrZ615
      REPO_NAME: android_kernel_google_gs101

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: android-gs-bluraviole-5.10-android14-qpr2-monolithic
          fetch-depth: 1
          submodules: false

      - name: Detect kernel source directory
        run: |
          echo "Listing repository contents:"
          ls -la
          if [ -f "Makefile" ] && [ -d "arch/arm64/configs" ] && [ -f "arch/arm64/configs/gs101_defconfig" ]; then
            echo "Kernel source found in repository root"
            echo "KERNEL_SRC_DIR=." >> $GITHUB_ENV
          else
            KERNEL_SRC_DIR=$(find . -maxdepth 3 -type f -name "gs101_defconfig" -exec dirname {} \; | head -n 1)
            if [ -z "$KERNEL_SRC_DIR" ]; then
              echo "Error: Could not find kernel source directory with gs101_defconfig" >&2
              exit 1
            fi
            KERNEL_SRC_DIR=$(dirname "$KERNEL_SRC_DIR")
            echo "Kernel source found in $KERNEL_SRC_DIR"
            echo "KERNEL_SRC_DIR=$KERNEL_SRC_DIR" >> $GITHUB_ENV
          fi
          cd "$KERNEL_SRC_DIR"
          echo "Current directory: $(pwd)"
          ls -la
          if [ ! -d "drivers" ]; then
            echo "Error: 'drivers/' directory not found in $KERNEL_SRC_DIR" >&2
            exit 1
          fi

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Validate inputs
        run: |
          if [ "${{ inputs.kernelsu_variant }}" != "Next" ]; then
            echo "Error: kernelsu_variant must be 'Next'" >&2
            exit 1
          fi
          VALID_BRANCHES=("Stable" "Dev" "Other")
          if [[ ! " ${VALID_BRANCHES[@]} " =~ " ${{ inputs.kernelsu_branch }} " ]]; then
            echo "Error: kernelsu_branch must be 'Stable', 'Dev', or 'Other'" >&2
            exit 1
          fi
          if [ "${{ inputs.kernelsu_branch }}" == "Other" ] && [ -z "${{ inputs.kernelsu_branch_other }}" ]; then
            echo "Error: Custom branch not provided for 'Other'" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses-dev \
            libncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            bc \
            ccache \
            rsync

      - name: Set up ccache
        run: |
          sudo apt update && sudo apt install -y ccache
          mkdir -p ~/.ccache
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache from cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      - name: Clone repositories
        run: |
          ANYKERNEL_BRANCH="riri"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          git clone https://github.com/${{ env.REPO_OWNER }}/AnyKernel3.git -b "$ANYKERNEL_BRANCH" --depth=1
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH" --depth=1
          git clone https://github.com/${{ env.REPO_OWNER }}/kernel_patches.git --depth=1

      - name: Add KernelSU
        run: |
          cd "$KERNEL_SRC_DIR"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next || {
            echo "Error: KernelSU setup failed. Dumping directory contents for debugging:"
            ls -la
            exit 1
          }
          cd KernelSU-Next
          if [ -z "${{ inputs.kernelsu_commit_hash }}" ]; then
            echo "Using latest KernelSU commit"
            git checkout $(git rev-parse origin/next)
          else
            echo "Using specified KernelSU commit: ${{ inputs.kernelsu_commit_hash }}"
            git checkout ${{ inputs.kernelsu_commit_hash }}
          fi
          cd ..

      - name: Apply SUSFS Patches
        run: |
          cd "$KERNEL_SRC_DIR"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./
          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          patch -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true
          cd KernelSU-Next
          cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
          patch -p1 --forward --fuzz=3 < 10_enable_susfs_for_ksu.patch || true
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_apk_sign.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_apk_sign.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_core_hook.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_core_hook.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_selinux.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_selinux.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_ksud.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_ksud.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_rules.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_rules.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_sucompat.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_sucompat.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_kernel_compat.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_kernel_compat.c.patch
          cd ..

      - name: Apply KSU Hooks
        run: |
          cd "$KERNEL_SRC_DIR"
          cp ../kernel_patches/next/next_hooks.patch ./
          patch -p1 --fuzz=3 < next_hooks.patch

      - name: Apply Hide Stuff Patches
        run: |
          cd "$KERNEL_SRC_DIR"
          cp ../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch

      - name: Apply KernelSU & SUSFS SUltan Fixes
        run: |
          cd "$KERNEL_SRC_DIR"
          sed -i "s/poofed_size: '%u'/poofed_size: '%llu'/g" ./fs/susfs.c
          sed -i "s/length of string: %u/length of string: %lu/g" ./fs/susfs.c

      - name: Add SUSFS Configuration Settings
        run: |
          cd "$KERNEL_SRC_DIR"
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./arch/arm64/configs/gs101_defconfig

      - name: Setup toolchain
        run: |
          TOOLCHAIN_TAR="x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz"
          wget https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/$TOOLCHAIN_TAR
          tar -xzf $TOOLCHAIN_TAR
          echo "TOOLCHAIN_PATH=$PWD/gcc-14.2.0-nolibc/aarch64-linux" >> $GITHUB_ENV
          echo "PATH=$PWD/gcc-14.2.0-nolibc/aarch64-linux/bin:$PATH" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          cd "$KERNEL_SRC_DIR"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-
          export CC=aarch64-linux-gcc
          make gs101_defconfig -j$(nproc --all)
          make -j$(nproc --all)

      - name: Check for .rej files
        if: failure()
        run: |
          echo "::group::Checking for .rej files..."
          REJ_FILES=$(find "$KERNEL_SRC_DIR" -name '*.rej')
          if [ -z "$REJ_FILES" ]; then
            echo "No .rej files found."
          else
            echo "Found .rej files:"
            echo "$REJ_FILES"
            for f in $REJ_FILES; do
              echo "--- $f ---"
              cat "$f"
            done
          fi
          echo "::endgroup::"

      - name: Upload .rej files as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects
          path: "${{ env.KERNEL_SRC_DIR }}/**/*.rej"
          if-no-files-found: warn

      - name: Debug Build Output
        if: ${{ always() }}
        run: |
          echo "Listing kernel source directory ($KERNEL_SRC_DIR):"
          ls -R "$KERNEL_SRC_DIR"
          echo "Listing AnyKernel3 directory:"
          ls -R AnyKernel3/
          if [ -d "$KERNEL_SRC_DIR/out" ]; then
            echo "Listing out directory:"
            ls -R "$KERNEL_SRC_DIR/out"
          else
            echo "No out/ directory found in $KERNEL_SRC_DIR"
          fi

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          cp "$KERNEL_SRC_DIR/out/arch/arm64/boot/Image.lz4" artifacts/Image.lz4
          cp "$KERNEL_SRC_DIR/out/arch/arm64/boot/dts/google/dtbo.img" artifacts/dtbo.img
          cd AnyKernel3
          cp "../$KERNEL_SRC_DIR/out/arch/arm64/boot/Image.lz4" ./Image.lz4
          cp "../$KERNEL_SRC_DIR/out/arch/arm64/boot/dts/google/dtbo.img" ./dtbo.img
          zip -r ../artifacts/gs101.zip ./*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gs101-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}
          path: artifacts/
