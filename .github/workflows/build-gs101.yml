name: Build and Release BluRaviole Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      test_release:
        description: 'Trigger a test release (skips build, uses dummy values)?'
        required: true
        type: boolean
        default: false
      kernelsu_variant:
        description: "Choose KernelSU (must be 'Next')"
        required: true
        type: string
        default: "Next"
      kernelsu_branch:
        description: "Choose ksu branch (must be 'Stable', 'Dev', or 'Other')"
        required: true
        type: string
        default: "Dev"
      kernelsu_branch_other:
        description: "If 'Other' is selected, specify your custom branch"
        required: false
        type: string
        default: ""
      kernelsu_commit_hash:
        description: "Specify the GitHub commit hash for KernelSU Next (leave blank for latest)"
        required: false
        type: string
      susfs_version:
        description: "Specify the SUSFS version"
        required: true
        type: string
        default: "v1.5.9"

env:
  BASE_VERSION: "1.5.9"
  REPO_OWNER: RiRiRawrZ615
  REPO_NAME: android_kernel_google_gs101
  KERNEL_VERSION: "5.10.209"
  STOCK_PATCH: "AP1A.240505.004"

jobs:
  build-kernel-gs101:
    if: ${{ !inputs.test_release }}
    uses: ./.github/workflows/kernel-gs101-5.10.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}
      kernelsu_commit_hash: ${{ inputs.kernelsu_commit_hash }}
      susfs_version: ${{ inputs.susfs_version }}

  trigger-release:
    runs-on: ubuntu-latest
    needs: build-kernel-gs101
    if: ${{ inputs.make_release && !inputs.test_release }}
    env:
      REPO_OWNER: RiRiRawrZ615
      REPO_NAME: android_kernel_google_gs101
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: android-gs-bluraviole-5.10-android14-qpr2-monolithic
          fetch-depth: 1
          submodules: false

      - name: Verify repository structure
        run: |
          echo "Listing working directory contents:"
          ls -la
          if [ ! -d "arch" ] || [ ! -f "Makefile" ]; then
            echo "Error: Kernel source directory structure not found. Expected kernel source files in repository root." >&2
            exit 1
          fi

      - name: Validate inputs and determine branch
        run: |
          if [ "${{ inputs.kernelsu_variant }}" != "Next" ]; then
            echo "Error: kernelsu_variant must be 'Next'" >&2
            exit 1
          fi
          VALID_BRANCHES=("Stable" "Dev" "Other")
          if [[ ! " ${VALID_BRANCHES[@]} " =~ " ${{ inputs.kernelsu_branch }} " ]]; then
            echo "Error: kernelsu_branch must be 'Stable', 'Dev', or 'Other'" >&2
            exit 1
          fi
          if [ "${{ inputs.kernelsu_branch }}" == "Other" ] && [ -z "${{ inputs.kernelsu_branch_other }}" ]; then
            echo "Error: Custom branch not provided for 'Other'" >&2
            exit 1
          fi
          if [ "${{ inputs.kernelsu_branch }}" == "Dev" ]; then
            BRANCH="next"
          elif [ "${{ inputs.kernelsu_branch }}" == "Other" ]; then
            BRANCH="${{ inputs.kernelsu_branch_other }}"
          else
            BRANCH=""
          fi
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Get KernelSU commit info
        run: |
          REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"
          REPO_URL2="KernelSU-Next/KernelSU-Next"
          if [ -z "${{ inputs.kernelsu_commit_hash }}" ]; then
            KSU_REF=$(git ls-remote --heads $REPO_URL refs/heads/next | awk '{print $1}')
          else
            KSU_REF=${{ inputs.kernelsu_commit_hash }}
          fi
          KSU_URL="https://github.com/$REPO_URL2/commit/$KSU_REF"
          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      - name: Detect KernelSU version
        run: |
          KSU_VERSION=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | jq -r '.[0].name' | grep -oP 'v\d+\.\d+\.\d+')
          [ -z "$KSU_VERSION" ] && KSU_VERSION="v1.0.9"
          KSU_MAIN_VERSION=$(echo "$KSU_VERSION" | sed 's/v//' | cut -d'.' -f1-2)
          KSU_SUB_VERSION=$(echo "$KSU_VERSION" | grep -oP '\d+$' || echo "12797")
          echo "KSU_MAIN_VERSION=$KSU_MAIN_VERSION" >> $GITHUB_ENV
          echo "KSU_SUB_VERSION=$KSU_SUB_VERSION" >> $GITHUB_ENV

      - name: Get SUSFS commit info
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/gki-android13-5.10 | awk '{ print $1 }')
          COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_URL=$COMMIT_URL" >> $GITHUB_ENV

      - name: Detect SUSFS Version
        run: |
          SUSFS_VERSION=${{ inputs.susfs_version }}
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV

      - name: Construct Release Information
        run: |
          RELEASE_NAME="BluRaviole_KSU_NEXT_${KSU_SUB_VERSION}_SUSFS_${SUSFS_VERSION}"
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "Current DEV Release" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "This contains KSU Next version ${{ env.KSU_MAIN_VERSION }} ${{ env.KSU_SUB_VERSION }} next susfs dev branch by RifsXD which can be found [here](https://github.com/rifsxd/KernelSU-Next)." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "It uses SuSFS ${{ env.SUSFS_VERSION }} made by Simon Punk which can be found [here](https://gitlab.com/simonpunk/susfs4ksu/-/releases)." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "And you can use the webui module by sidex that can be found [here](https://github.com/sidex15/susfs4ksu-module)." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "Kernel Version is ${{ env.KERNEL_VERSION }} currently." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "This kernel is ONLY MEANT FOR STOCK ROM WITH PATCH DATE OF \`${{ env.STOCK_PATCH }}\` currently." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Commit Hashes:**" >> $GITHUB_ENV
          echo "- KernelSU: [$KSU_REF]($KSU_URL)" >> $GITHUB_ENV
          echo "- SUSFS4KSU: [$COMMIT_HASH]($COMMIT_URL)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "LTO: thin" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate and Create New Tag
        run: |
          BASE_TAG="v${{ env.SUSFS_VERSION }}"
          TAGS=$(git tag -l "$BASE_TAG-r*" | sort -V)
          if [ -z "$TAGS" ]; then
            NEW_TAG="$BASE_TAG-r1"
          else
            LAST_TAG=$(echo "$TAGS" | tail -n1)
            LAST_NUM=$(echo "$LAST_TAG" | sed -E "s/$BASE_TAG-r([0-9]+)/\1/")
            NEW_NUM=$((LAST_NUM + 1))
            NEW_TAG="$BASE_TAG-r$NEW_NUM"
          fi
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag $NEW_TAG || echo "Tag already exists, continuing..."
          git push origin $NEW_TAG || echo "Tag push failed, may already exist"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-gs101-android13-5.10-209
          path: ./downloaded-artifacts

      - name: Prepare Artifacts
        run: |
          mkdir -p ./release-artifacts
          KSU_VERSION="${{ env.KSU_MAIN_VERSION }}"
          KSU_SUB_VERSION="${{ env.KSU_SUB_VERSION }}"
          SUSFS_VERSION="${{ env.SUSFS_VERSION }}"
          NEW_BASE_NAME="BluRaviole_KSU_NEXT_${KSU_SUB_VERSION}_SUSFS_${SUSFS_VERSION}"
          mv ./downloaded-artifacts/gs101.zip "./release-artifacts/${NEW_BASE_NAME}.zip"
          mv ./downloaded-artifacts/Image.lz4 "./release-artifacts/${NEW_BASE_NAME}.img"
          mv ./downloaded-artifacts/dtbo.img "./release-artifacts/${NEW_BASE_NAME}-dtbo.img"

      - name: Verify Artifacts
        run: |
          if [ ! -f "./release-artifacts/"*.zip ] || [ ! -f "./release-artifacts/"*.img ]; then
            echo "Error: Required artifacts missing!"
            exit 1
          fi
          echo "Artifacts verified:"
          ls -lh ./release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          prerelease: true
          draft: false
          files: |
            ./release-artifacts/*.zip
            ./release-artifacts/*.img

  test-release:
    runs-on: ubuntu-latest
    if: ${{ inputs.make_release && inputs.test_release }}
    env:
      REPO_OWNER: RiRiRawrZ615
      REPO_NAME: android_kernel_google_gs101
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: android-gs-bluraviole-5.10-android14-qpr2-monolithic
          fetch-depth: 1
          submodules: false

      - name: Verify repository structure
        run: |
          echo "Listing working directory contents:"
          ls -la
          if [ ! -d "arch" ] || [ ! -f "Makefile" ]; then
            echo "Error: Kernel source directory structure not found. Expected kernel source files in repository root." >&2
            exit 1
          fi

      - name: Validate inputs and determine branch
        run: |
          if [ "${{ inputs.kernelsu_variant }}" != "Next" ]; then
            echo "Error: kernelsu_variant must be 'Next'" >&2
            exit 1
          fi
          VALID_BRANCHES=("Stable" "Dev" "Other")
          if [[ ! " ${VALID_BRANCHES[@]} " =~ " ${{ inputs.kernelsu_branch }} " ]]; then
            echo "Error: kernelsu_branch must be 'Stable', 'Dev', or 'Other'" >&2
            exit 1
          fi
          if [ "${{ inputs.kernelsu_branch }}" == "Other" ] && [ -z "${{ inputs.kernelsu_branch_other }}" ]; then
            echo "Error: Custom branch not provided for 'Other'" >&2
            exit 1
          fi
          if [ "${{ inputs.kernelsu_branch }}" == "Dev" ]; then
            BRANCH="next"
          elif [ "${{ inputs.kernelsu_branch }}" == "Other" ]; then
            BRANCH="${{ inputs.kernelsu_branch_other }}"
          else
            BRANCH=""
          fi
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Get KernelSU commit info
        run: |
          REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"
          REPO_URL2="KernelSU-Next/KernelSU-Next"
          if [ -z "${{ inputs.kernelsu_commit_hash }}" ]; then
            KSU_REF=$(git ls-remote --heads $REPO_URL refs/heads/next | awk '{print $1}')
          else
            KSU_REF=${{ inputs.kernelsu_commit_hash }}
          fi
          KSU_URL="https://github.com/$REPO_URL2/commit/$KSU_REF"
          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      - name: Detect KernelSU version
        run: |
          echo "Using dummy values for test release..."
          echo "KSU_MAIN_VERSION=1.0.9" >> $GITHUB_ENV
          echo "KSU_SUB_VERSION=12797" >> $GITHUB_ENV

      - name: Get SUSFS commit info
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/gki-android13-5.10 | awk '{ print $1 }')
          COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_URL=$COMMIT_URL" >> $GITHUB_ENV

      - name: Detect SUSFS Version
        run: |
          echo "Using dummy SUSFS version for test release..."
          echo "SUSFS_VERSION=v1.5.9" >> $GITHUB_ENV

      - name: Construct Release Information
        run: |
          RELEASE_NAME="BluRaviole_KSU_NEXT_${KSU_SUB_VERSION}_SUSFS_${SUSFS_VERSION} TEST"
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "Current DEV Release" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "This contains KSU Next version ${{ env.KSU_MAIN_VERSION }} ${{ env.KSU_SUB_VERSION }} next susfs dev branch by RifsXD which can be found [here](https://github.com/rifsxd/KernelSU-Next)." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "It uses SuSFS ${{ env.SUSFS_VERSION }} made by Simon Punk which can be found [here](https://gitlab.com/simonpunk/susfs4ksu/-/releases)." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "And you can use the webui module by sidex that can be found [here](https://github.com/sidex15/susfs4ksu-module)." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "Kernel Version is ${{ env.KERNEL_VERSION }} currently." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "This kernel is ONLY MEANT FOR STOCK ROM WITH PATCH DATE OF \`${{ env.STOCK_PATCH }}\` currently." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**NOTE: THIS IS A TEST RELEASE**" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Commit Hashes:**" >> $GITHUB_ENV
          echo "- KernelSU: [$KSU_REF]($KSU_URL)" >> $GITHUB_ENV
          echo "- SUSFS4KSU: [$COMMIT_HASH]($COMMIT_URL)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "LTO: thin" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate and Create New Tag
        run: |
          BASE_TAG="test-v${{ env.SUSFS_VERSION }}"
          TAGS=$(git tag -l "$BASE_TAG-r*" | sort -V)
          if [ -z "$TAGS" ]; then
            NEW_TAG="$BASE_TAG-r1"
          else
            LAST_TAG=$(echo "$TAGS" | tail -n1)
            LAST_NUM=$(echo "$LAST_TAG" | sed -E "s/$BASE_TAG-r([0-9]+)/\1/")
            NEW_NUM=$((LAST_NUM + 1))
            NEW_TAG="$BASE_TAG-r$NEW_NUM"
          fi
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag $NEW_TAG || echo "Tag already exists, continuing..."
          git push origin $NEW_TAG || echo "Tag push failed, may already exist"

      - name: Prepare Artifacts
        run: |
          mkdir -p ./release-artifacts
          KSU_VERSION="${{ env.KSU_MAIN_VERSION }}"
          KSU_SUB_VERSION="${{ env.KSU_SUB_VERSION }}"
          SUSFS_VERSION="${{ env.SUSFS_VERSION }}"
          NEW_BASE_NAME="BluRaviole_KSU_NEXT_${KSU_SUB_VERSION}_SUSFS_${SUSFS_VERSION}"
          echo "Test release artifact - not for actual use" > test-readme.txt
          zip -j "./release-artifacts/${NEW_BASE_NAME}.zip" test-readme.txt
          echo "Test content" > "./release-artifacts/${NEW_BASE_NAME}.img"
          echo "Test content" > "./release-artifacts/${NEW_BASE_NAME}-dtbo.img"

      - name: Verify Artifacts
        run: |
          if [ ! -f "./release-artifacts/"*.zip ] || [ ! -f "./release-artifacts/"*.img ]; then
            echo "Error: Required artifacts missing!"
            exit 1
          fi
          echo "Artifacts verified:"
          ls -lh ./release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          prerelease: true
          draft: false
          files: |
            ./release-artifacts/*.zip
            ./release-artifacts/*.img