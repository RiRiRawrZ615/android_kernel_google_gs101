name: Build and Release BluRaviole Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      test_release:
        description: 'Trigger a test release (skips build, uses dummy values)?'
        required: true
        type: boolean
        default: false
      kernelsu_variant:
        description: "Choose KernelSU (must be 'Next')"
        required: true
        type: string
        default: "Next"
      kernelsu_branch:
        description: "Choose ksu branch (must be 'Stable', 'Dev', or 'Other')"
        required: true
        type: string
        default: "Dev"
      kernelsu_branch_other:
        description: "If 'Other' is selected, specify your custom branch"
        required: false
        type: string
        default: ""
      kernelsu_commit_hash:
        description: "Specify the GitHub commit hash for KernelSU Next (leave blank for latest)"
        required: false
        type: string
        default: ""

env:
  BASE_VERSION: "1.5.9"
  REPO_OWNER: "RiRiRawrZ615"
  REPO_NAME: "android_kernel_google_gs101"

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    if: ${{ !inputs.test_release }}  # Only skip build if test_release is true
    outputs:
      KSU_VERSION: ${{ steps.extract_versions.outputs.KSU_VERSION }}
      KSU_SUBVERSION: ${{ steps.extract_versions.outputs.KSU_SUBVERSION }}
      SUSFS_VERSION: ${{ steps.extract_versions.outputs.SUSFS_VERSION }}

    steps:
      # [Previous build steps remain the same until Add KernelSU step]
      
      - name: Add KernelSU
        run: |
          cd "$CONFIG"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          cd KernelSU-Next
          
          # Use provided commit hash or default to latest
          if [ -z "${{ inputs.kernelsu_commit_hash }}" ]; then
            echo "Using latest KernelSU commit"
            git checkout $(git rev-parse origin/next)
          else
            echo "Using specified KernelSU commit: ${{ inputs.kernelsu_commit_hash }}"
            git checkout ${{ inputs.kernelsu_commit_hash }}
          fi
          cd ..

      # [Rest of build steps remain the same]

  trigger-release:
    runs-on: ubuntu-latest
    needs: build-kernel
    if: ${{ inputs.make_release }}  # This job only runs if make_release is true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup version info
        run: |
          if [ "${{ inputs.test_release }}" == "true" ]; then
            # Use test/dummy values
            echo "ZIP_NAME=BluRaviole_KSU_NEXT_12797_SUSFS_1.5.9.zip" >> $GITHUB_ENV
            echo "RELEASE_NAME=BluRaviole Kernel with KSU Next 12797 & SUSFS 1.5.9 (TEST RELEASE)" >> $GITHUB_ENV
            echo "KSU_SUBVERSION=12797" >> $GITHUB_ENV
            echo "SUSFS_VERSION=1.5.9" >> $GITHUB_ENV
          else
            # Use real values from build job
            KSU_SUBVERSION=${{ needs.build-kernel.outputs.KSU_SUBVERSION }}
            SUSFS_VERSION=${{ needs.build-kernel.outputs.SUSFS_VERSION }}
            echo "ZIP_NAME=BluRaviole_KSU_NEXT_${KSU_SUBVERSION}_SUSFS_${SUSFS_VERSION}.zip" >> $GITHUB_ENV
            echo "RELEASE_NAME=BluRaviole Kernel with KSU Next $KSU_SUBVERSION & SUSFS $SUSFS_VERSION" >> $GITHUB_ENV
            echo "KSU_SUBVERSION=$KSU_SUBVERSION" >> $GITHUB_ENV
            echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV
          fi

      - name: Construct release notes
        run: |
          if [ "${{ inputs.test_release }}" == "true" ]; then
            KSU_REF="TEST_RELEASE_DUMMY_HASH"
            SUSFS_HASH="TEST_RELEASE_DUMMY_HASH"
            RELEASE_NOTES="**TEST RELEASE - NOT FOR PRODUCTION USE**\n\n"
          else
            KSU_REF="${{ inputs.kernelsu_commit_hash }}"
            SUSFS_HASH=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android13-5.10 | awk '{ print $1 }')
            RELEASE_NOTES=""
          fi

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "${RELEASE_NOTES}**BluRaviole Kernel for Pixel 6/Pro (oriole/raven)**"
          echo ""
          echo "**Requirements:**"
          echo "- December 2023 Security Patch or newer"
          echo "- KernelSU Manager installed"
          echo ""
          echo "**Features:**"
          echo "- KernelSU Next ${{ env.KSU_SUBVERSION }}"
          echo "- SUSFS ${{ env.SUSFS_VERSION }}"
          echo "- Magic Mount Support"
          echo "- Wireguard Support"
          echo "- CASS Scheduler"
          echo ""
          echo "**Notes:**"
          echo "1. This kernel is ONLY for Pixel 6/Pro (oriole/raven)"
          echo "2. Requires December 2023 security patch or newer"
          echo "3. SUSFS requires companion module from:"
          echo "   https://github.com/sidex15/ksu_module_susfs"
          echo ""
          echo "**Credits:**"
          echo "- KernelSU Team for KernelSU"
          echo "- Simonpunk for SUSFS"
          echo "- RiRiRawrZ615 for kernel builds"
          echo ""
          echo "**Commit Hashes:**"
          echo "- KernelSU: ${KSU_REF}"
          echo "- SUSFS: ${SUSFS_HASH}"
          echo "EOF" >> $GITHUB_ENV

      # [Rest of the release steps remain the same]
