name: Build and Release BluRaviole Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      test_release:
        description: 'Trigger a test release (skips build, uses dummy values)?'
        required: true
        type: boolean
        default: false
      kernelsu_variant:
        description: "Choose KernelSU (must be 'Next')"
        required: true
        type: string
        default: "Next"
      kernelsu_branch:
        description: "Choose ksu branch (must be 'Stable', 'Dev', or 'Other')"
        required: true
        type: string
        default: "Dev"
      kernelsu_branch_other:
        description: "If 'Other' is selected, specify your custom branch"
        required: false
        type: string
        default: ""
      kernelsu_commit_hash:
        description: "Specify the GitHub commit hash for KernelSU Next"
        required: true
        type: string
        default: "3fd61e0ee5ee5e6fe941a892924ac26aa752b618"

env:
  BASE_VERSION: "1.5.9"
  REPO_OWNER: "RiRiRawrZ615"
  REPO_NAME: "android_kernel_google_gs101"

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    if: ${{ !inputs.test_release }}
    outputs:
      KSU_VERSION: ${{ steps.extract_versions.outputs.KSU_VERSION }}
      KSU_SUBVERSION: ${{ steps.extract_versions.outputs.KSU_SUBVERSION }}
      SUSFS_VERSION: ${{ steps.extract_versions.outputs.SUSFS_VERSION }}

    steps:
      # [Previous build steps remain exactly the same until package artifacts]
      
      - name: Package artifacts
        run: |
          cd "$CONFIG"
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          cp ./out/arch/arm64/boot/dts/google/dtbo.img ../AnyKernel3/dtbo.img
          
          cd ../AnyKernel3
          zip -r ../gs101.zip *
          cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gs101
          path: ./gs101.zip

  trigger-release:
    runs-on: ubuntu-latest
    needs: build-kernel
    if: ${{ inputs.make_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup version info
        run: |
          KSU_VERSION=${{ needs.build-kernel.outputs.KSU_VERSION }}
          KSU_SUBVERSION=${{ needs.build-kernel.outputs.KSU_SUBVERSION }}
          SUSFS_VERSION=${{ needs.build-kernel.outputs.SUSFS_VERSION }}
          
          echo "ZIP_NAME=BluRaviole_KSU_NEXT_${KSU_SUBVERSION}_SUSFS_${SUSFS_VERSION}.zip" >> $GITHUB_ENV
          echo "RELEASE_NAME=BluRaviole Kernel with KSU Next $KSU_SUBVERSION & SUSFS $SUSFS_VERSION" >> $GITHUB_ENV

      - name: Construct release notes
        run: |
          KSU_VERSION=${{ needs.build-kernel.outputs.KSU_VERSION }}
          KSU_SUBVERSION=${{ needs.build-kernel.outputs.KSU_SUBVERSION }}
          SUSFS_VERSION=${{ needs.build-kernel.outputs.SUSFS_VERSION }}
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "**BluRaviole Kernel for Pixel 6/Pro (oriole/raven)**"
          echo ""
          echo "**Requirements:**"
          echo "- December 2023 Security Patch or newer"
          echo "- KernelSU Manager installed"
          echo ""
          echo "**Features:**"
          echo "- KernelSU Next $KSU_VERSION.$KSU_SUBVERSION"
          echo "- SUSFS $SUSFS_VERSION"
          echo "- Magic Mount Support"
          echo "- Wireguard Support"
          echo "- CASS Scheduler"
          echo ""
          echo "**Notes:**"
          echo "1. This kernel is ONLY for Pixel 6/Pro (oriole/raven)"
          echo "2. Requires December 2023 security patch or newer"
          echo "3. SUSFS requires companion module from:"
          echo "   https://github.com/sidex15/ksu_module_susfs"
          echo ""
          echo "**Credits:**"
          echo "- KernelSU Team for KernelSU"
          echo "- Simonpunk for SUSFS"
          echo "- RiRiRawrZ615 for kernel builds"
          echo ""
          echo "**Commit Hashes:**"
          echo "- KernelSU: ${{ inputs.kernelsu_commit_hash }}"
          echo "- SUSFS: $(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android13-5.10 | awk '{ print $1 }')"
          echo "EOF" >> $GITHUB_ENV

      - name: Generate tag
        run: |
          SUSFS_VERSION=${{ needs.build-kernel.outputs.SUSFS_VERSION }}
          TAGS=$(git tag -l "v$SUSFS_VERSION-r*" | sort -V)
          
          if [ -z "$TAGS" ]; then
            NEW_TAG="v$SUSFS_VERSION-r1"
          else
            LAST_TAG=$(echo "$TAGS" | tail -n1)
            LAST_NUM=$(echo "$LAST_TAG" | sed -E "s/v${SUSFS_VERSION//./\\.}-r([0-9]+)/\1/")
            NEW_NUM=$((LAST_NUM + 1))
            NEW_TAG="v$SUSFS_VERSION-r$NEW_NUM"
          fi
          
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git tag $NEW_TAG || echo "Tag exists"
          git push origin $NEW_TAG || echo "Tag push failed"

      - name: Prepare release asset
        if: ${{ !inputs.test_release }}
        uses: actions/download-artifact@v4
        with:
          name: kernel-gs101
          path: ./release-artifacts

      - name: Create test asset
        if: ${{ inputs.test_release }}
        run: |
          mkdir -p ./release-artifacts
          KSU_SUBVERSION="12797"  # Example test value
          SUSFS_VERSION="1.5.9"   # Example test value
          echo "Test content" > "./release-artifacts/BluRaviole_KSU_NEXT_${KSU_SUBVERSION}_SUSFS_${SUSFS_VERSION}.zip"
          echo "ZIP_NAME=BluRaviole_KSU_NEXT_${KSU_SUBVERSION}_SUSFS_${SUSFS_VERSION}.zip" >> $GITHUB_ENV

      - name: Rename artifact
        run: |
          mv ./release-artifacts/gs101.zip "./release-artifacts/${{ env.ZIP_NAME }}"

      - name: Create release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.NEW_TAG }}
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          prerelease: true

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ env.ZIP_NAME }}
          asset_name: ${{ env.ZIP_NAME }}
          asset_content_type: application/zip
