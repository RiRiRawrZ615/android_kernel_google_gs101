name: Build and Release BluRaviole Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      test_release:
        description: 'Trigger a test release (skips build, uses dummy values)?'
        required: true
        type: boolean
        default: false
      kernelsu_variant:
        description: "Choose KernelSU (must be 'Next')"
        required: true
        type: string
        default: "Next"
      kernelsu_branch:
        description: "Choose ksu branch (must be 'Stable', 'Dev', or 'Other')"
        required: true
        type: string
        default: "Dev"
      kernelsu_branch_other:
        description: "If 'Other' is selected, specify your custom branch"
        required: false
        type: string
        default: ""
      kernelsu_commit_hash:
        description: "Specify the GitHub commit hash for KernelSU Next (leave blank for latest)"
        required: false
        type: string
        default: ""

env:
  BASE_VERSION: "1.5.9"
  REPO_OWNER: "RiRiRawrZ615"
  REPO_NAME: "android_kernel_google_gs101"
  KERNEL_VERSION: "5.10.209"
  STOCK_PATCH: "ΑΡ1Α.240505.004"

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    if: ${{ inputs.make_release }}
    outputs:
      KSU_VERSION: ${{ steps.extract_versions.outputs.KSU_VERSION }}
      KSU_SUBVERSION: ${{ steps.extract_versions.outputs.KSU_SUBVERSION }}
      SUSFS_VERSION: ${{ steps.extract_versions.outputs.SUSFS_VERSION }}

    steps:
      - name: Check if test release
        id: check_test_release
        run: |
          if [ "${{ inputs.test_release }}" == "true" ]; then
            echo "::warning::Test release selected, skipping build"
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Maximize build space
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses-dev \
            libncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            bc \
            rsync

      - name: Clone repositories
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          ANYKERNEL_BRANCH="riri"
          SUSFS_BRANCH="gki-android13-5.10"
          
          git clone https://github.com/$REPO_OWNER/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          git clone https://github.com/$REPO_OWNER/kernel_patches.git
          git clone https://github.com/$REPO_OWNER/$REPO_NAME.git -b android-gs-bluraviole-5.10-android14-qpr2-monolithic

      - name: Set CONFIG directory
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          echo "CONFIG_DIR=android_kernel_google_gs101" >> $GITHUB_ENV

      - name: Add KernelSU
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          cd "${{ env.CONFIG_DIR }}"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          cd KernelSU-Next
          
          if [ -z "${{ inputs.kernelsu_commit_hash }}" ]; then
            echo "Using latest KernelSU commit"
            git checkout $(git rev-parse origin/next)
          else
            echo "Using specified KernelSU commit: ${{ inputs.kernelsu_commit_hash }}"
            git checkout ${{ inputs.kernelsu_commit_hash }}
          fi
          cd ..

      - name: Extract versions
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        id: extract_versions
        run: |
          cd "${{ env.CONFIG_DIR }}"
          KSU_VERSION=$(grep -oP 'KERNELSU_VERSION := \K.*' KernelSU/version.mk | tr -d '[:space:]')
          KSU_SUBVERSION=$(grep -oP 'KERNELSU_SUBVERSION := \K.*' KernelSU/version.mk | tr -d '[:space:]')
          SUSFS_VERSION=$(grep -oP 'SUSFS_VERSION := \K.*' fs/susfs/version.mk | tr -d '[:space:]')
          
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "KSU_SUBVERSION=$KSU_SUBVERSION" >> $GITHUB_OUTPUT
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_OUTPUT

      - name: Apply SUSFS Patches
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          cd "${{ env.CONFIG_DIR }}"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.10.patch ./
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          patch -p1 < 50_add_susfs_in_gki-android13-5.10.patch || true
          
          cd ./KernelSU-Next
          cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
          patch -p1 --forward --fuzz=3 < 10_enable_susfs_for_ksu.patch || true
              
          cp ../../kernel_patches/next/susfs_fix_patches/v1.5.9/fix_apk_sign.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_apk_sign.c.patch
              
          cp ../../kernel_patches/next/susfs_fix_patches/v1.5.9/fix_core_hook.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_core_hook.c.patch
             
          cp ../../kernel_patches/next/susfs_fix_patches/v1.5.9/fix_selinux.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_selinux.c.patch
             
          cp ../../kernel_patches/next/susfs_fix_patches/v1.5.9/fix_ksud.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_ksud.c.patch

          cp ../../kernel_patches/next/susfs_fix_patches/v1.5.9/fix_rules.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_rules.c.patch
          cd ..

      - name: Apply KSU Hooks
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          cd "${{ env.CONFIG_DIR }}"
          cp ../kernel_patches/next/next_hooks.patch ./
          patch -p1 --fuzz=3 < ./next_hooks.patch

      - name: Apply Hide Stuff Patches
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          cd "${{ env.CONFIG_DIR }}"
          cp ../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch

      - name: Apply KernelSU & SUSFS SUltan Fixes
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          cd "${{ env.CONFIG_DIR }}"
          sed -i "s/poofed_size: '%u'/poofed_size: '%llu'/g" ./fs/susfs.c
          sed -i "s/length of string: %u/length of string: %lu/g" ./fs/susfs.c

      - name: Add SUSFS Configuration Settings
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          cd "${{ env.CONFIG_DIR }}"
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./arch/arm64/configs/gs101_defconfig

      - name: Setup toolchain
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          TOOLCHAIN_TAR="x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz"
          wget https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/$TOOLCHAIN_TAR
          tar -xzf $TOOLCHAIN_TAR
          echo "TOOLCHAIN_PATH=$PWD/gcc-14.2.0-nolibc/aarch64-linux" >> $GITHUB_ENV
          echo "PATH=$PWD/gcc-14.2.0-nolibc/aarch64-linux/bin:$PATH" >> $GITHUB_ENV

      - name: Build kernel
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          cd "${{ env.CONFIG_DIR }}"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-
          export CC=aarch64-linux-gcc
          
          make gs101_defconfig -j$(nproc --all)
          make -j$(nproc --all)

      - name: Package artifacts
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        run: |
          cd "${{ env.CONFIG_DIR }}"
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          cp ./out/arch/arm64/boot/dts/google/dtbo.img ../AnyKernel3/dtbo.img
          
          cd ../AnyKernel3
          zip -r ../gs101.zip *
          cd ..

      - name: Upload artifacts
        if: ${{ steps.check_test_release.outputs.skip_build == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gs101
          path: ./gs101.zip

  trigger-release:
    runs-on: ubuntu-latest
    needs: build-kernel
    if: ${{ inputs.make_release }}
    steps:
      - name: Setup version info
        run: |
          if [ "${{ inputs.test_release }}" == "true" ]; then
            echo "ZIP_NAME=BluRaviole_KSU_NEXT_12798_SUSFS_1.5.9.zip" >> $GITHUB_ENV
            echo "RELEASE_NAME=BluRaviole v1.5.9 TEST" >> $GITHUB_ENV
            echo "KSU_VERSION=1.0.9" >> $GITHUB_ENV
            echo "KSU_SUBVERSION=12798" >> $GITHUB_ENV
            echo "SUSFS_VERSION=1.5.9" >> $GITHUB_ENV
          else
            echo "ZIP_NAME=BluRaviole_KSU_NEXT_${{ needs.build-kernel.outputs.KSU_SUBVERSION }}_SUSFS_${{ needs.build-kernel.outputs.SUSFS_VERSION }}.zip" >> $GITHUB_ENV
            echo "RELEASE_NAME=BluRaviole v${{ needs.build-kernel.outputs.SUSFS_VERSION }}" >> $GITHUB_ENV
            echo "KSU_VERSION=${{ needs.build-kernel.outputs.KSU_VERSION }}" >> $GITHUB_ENV
            echo "KSU_SUBVERSION=${{ needs.build-kernel.outputs.KSU_SUBVERSION }}" >> $GITHUB_ENV
            echo "SUSFS_VERSION=${{ needs.build-kernel.outputs.SUSFS_VERSION }}" >> $GITHUB_ENV
          fi

      - name: Construct release notes
        run: |
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "### Kernel Information"
          echo "- **Kernel Version**: ${{ env.KERNEL_VERSION }}"
          echo "- **Base Version**: ${{ env.BASE_VERSION }}"
          echo "- **Stock Patch**: \`${{ env.STOCK_PATCH }}\`"
          echo ""
          echo "### KernelSU Details"
          echo "- **Version**: ${{ env.KSU_VERSION }}"
          echo "- **Subversion**: ${{ env.KSU_SUBVERSION }}"
          echo "- **Variant**: ${{ inputs.kernelsu_variant }}"
          echo "- **Branch**: ${{ inputs.kernelsu_branch }}"
          if [ -n "${{ inputs.kernelsu_branch_other }}" ]; then
            echo "- **Custom Branch**: ${{ inputs.kernelsu_branch_other }}"
          fi
          if [ -n "${{ inputs.kernelsu_commit_hash }}" ]; then
            echo "- **Commit Hash**: ${{ inputs.kernelsu_commit_hash }}"
          fi
          echo ""
          echo "### SUSFS Details"
          echo "- **Version**: ${{ env.SUSFS_VERSION }}"
          echo ""
          echo "### Compatibility Notice"
          echo "This kernel is ONLY FOR STOCK ROM WITH PATCH DATE OF \`${{ env.STOCK_PATCH }}\`"
          if [ "${{ inputs.test_release }}" == "true" ]; then
            echo ""
            echo "**NOTE: THIS IS A TEST RELEASE**"
          fi
          echo "EOF" >> $GITHUB_ENV

      - name: Generate tag
        run: |
          if [ "${{ inputs.test_release }}" == "true" ]; then
            NEW_TAG="test-v${{ env.SUSFS_VERSION }}-r1"
          else
            SUSFS_VERSION=${{ needs.build-kernel.outputs.SUSFS_VERSION }}
            TAGS=$(git tag -l "v$SUSFS_VERSION-r*" | sort -V)
            
            if [ -z "$TAGS" ]; then
              NEW_TAG="v$SUSFS_VERSION-r1"
            else
              LAST_TAG=$(echo "$TAGS" | tail -n1)
              LAST_NUM=$(echo "$LAST_TAG" | sed -E "s/v${SUSFS_VERSION//./\\.}-r([0-9]+)/\1/")
              NEW_NUM=$((LAST_NUM + 1))
              NEW_TAG="v$SUSFS_VERSION-r$NEW_NUM"
            fi
          fi
          
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git tag $NEW_TAG || echo "Tag exists"
          git push origin $NEW_TAG || echo "Tag push failed"

      - name: Prepare release asset
        if: ${{ !inputs.test_release }}
        uses: actions/download-artifact@v4
        with:
          name: kernel-gs101
          path: ./release-artifacts

      - name: Create test asset
        if: ${{ inputs.test_release }}
        run: |
          mkdir -p ./release-artifacts
          echo "Test release content" > "./release-artifacts/${{ env.ZIP_NAME }}"

      - name: Rename artifact
        run: |
          if [ "${{ inputs.test_release }}" != "true" ]; then
            mv ./release-artifacts/gs101.zip "./release-artifacts/${{ env.ZIP_NAME }}"
          fi

      - name: Create release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.NEW_TAG }}
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          prerelease: true

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ env.ZIP_NAME }}
          asset_name: ${{ env.ZIP_NAME }}
          asset_content_type: application/zip
